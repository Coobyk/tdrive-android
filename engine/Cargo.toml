[package]
name = "tdrive-engine"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# A static library the phone app links into its own shared object, so the
# engine's code is inside the app's .so and nothing is loaded at run time.
# The ordinary library is there too, so the bridge can be walked by a test.
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
serde_json = "1"

[dependencies]
# The engine itself: the drive's format, its Telegram transport and its
# cryptography, shared with the desktop application. The desktop's own
# dependencies are not wanted here, so the default features are off.
tdrive-rs = { git = "https://github.com/Coobyk/tdrive-rs.git", default-features = false }
jni = "0.21"
serde_json = "1"
log = "0.4"
# The engine's own types are named here, so the crates they live in are named
# here too.
grammers-client = "0.10"
grammers-session = "0.10"
chrono = { version = "0.4", features = ["serde"] }
# The Telegram client's two-factor helper uses the safe-prime checker, whose
# signature changed in the released 2.0; the release candidate is the one it
# was written against, and the desktop application resolves to it as well.
glass_pumpkin = "=2.0.0-rc0"

[profile.release]
# The phone's libraries are small; the engine is the whole app's weight.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
