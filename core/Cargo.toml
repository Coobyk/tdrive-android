[package]
name = "tdrive-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
async-channel = "2"
grammers-client = "0.12.0"
grammers-session = "0.12.0"
grammers-tl-types = "0.12.0"
grammers-mtsender = "0.12.0"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hkdf = "0.12"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hex = "0.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rand = "0.10.3"
thiserror = "2.0.21"
base64 = "0.23.1"
jni = "0.21"
log = "0.4"
android_logger = "0.14"
